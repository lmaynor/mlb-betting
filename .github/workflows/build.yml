name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Syntax check
        run: python3 -m compileall -q mlb_core/ runners/ main.py
      - name: Test
        run: pytest tests/ -v
