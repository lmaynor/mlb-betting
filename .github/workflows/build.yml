name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Syntax check
        run: python3 -m py_compile main.py runners/*.py mlb_core/tracking/bet_tracker.py mlb_core/risk/exposure.py mlb_core/data/game_result.py
      - name: Test
        run: pytest tests/ -v
